<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Krish Lalani</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #f7f9f5;
        color: #172b25;
      }
      main {
        max-width: 440px;
        text-align: center;
      }
      .code {
        font-size: 80px;
        margin: 0;
        color: #23745a;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.7;
      }
      a {
        display: inline-block;
        padding: 14px 24px;
        margin-top: 16px;
        border-radius: 6px;
        background: #172b25;
        color: #f7f9f5;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #23745a;
        outline-offset: 5px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101a16;
          color: #edf2e9;
        }
        .code {
          color: #a8dcb0;
        }
        a {
          background: #a8dcb0;
          color: #101a16;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>
        This link may have changed. You can find my projects, experience, and
        contact details on the portfolio.
      </p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
